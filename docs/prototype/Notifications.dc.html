<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Headroom notifications</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
a{color:#2570dc}a:hover{color:#0b4fb0}
button{font:inherit}
</style>
</helmet>
<div style="width: 760px; height: 580px; box-sizing: border-box; padding: 32px; background: #f5f5f7; font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Text', system-ui, sans-serif; font-size: 13px; color: #1d1d1f; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 24px; -webkit-font-smoothing: antialiased">
<sc-for list="{{themes}}" as="th" hint-placeholder-count="2">
<div style="display: flex; flex-direction: column; gap: 10px">
<span style="font-size: 15px; font-weight: 600">{{th.name}}</span>
<div style="position: relative; overflow: hidden; border-radius: 16px; background: {{th.wall}}; padding: 14px; display: flex; flex-direction: column; gap: 12px; flex: 1">
<span aria-hidden="true" style="position: absolute; left: -50px; top: 150px; width: 280px; height: 260px; border-radius: 50%; background: {{th.b1}}; filter: blur(55px); opacity: 0.85"></span>
<span aria-hidden="true" style="position: absolute; left: 170px; top: -70px; width: 260px; height: 240px; border-radius: 50%; background: {{th.b2}}; filter: blur(55px); opacity: 0.8"></span>
<sc-for list="{{th.notes}}" as="n" hint-placeholder-count="3">
<div style="position: relative; border-radius: 22px; background: {{th.card}}; backdrop-filter: blur(30px) saturate(1.8); -webkit-backdrop-filter: blur(30px) saturate(1.8); box-shadow: 0 10px 28px rgba(0,0,0,0.2), inset 0 1px 0 {{th.edge}}, inset 0 0 0 0.5px {{th.rim}}, 0 0 0 0.5px {{th.hair}}; padding: 12px; display: flex; gap: 10px; color: {{th.text}}">
<span aria-hidden="true" style="flex: none; width: 34px; height: 34px; border-radius: 8px; background: #24324a; display: grid; place-items: center">
<svg width="22" height="16" viewBox="0 0 22 16"><rect x="1" y="1" width="20" height="14" rx="3.5" fill="none" stroke="#ffffff" stroke-width="1.6"></rect><rect x="4" y="9" width="9" height="2.6" rx="1.3" fill="#5fe07e"></rect><circle cx="17" cy="10.3" r="1.2" fill="#ffffff"></circle></svg>
</span>
<div style="flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px">
<div style="display: flex; justify-content: space-between; gap: 8px"><span style="font-weight: 600">{{n.title}}</span><span style="font-size: 12px; color: {{th.sec}}">{{n.time}}</span></div>
<span style="line-height: 1.35">{{n.body}}</span>
<div style="display: flex; gap: 6px; margin-top: 6px">
<button type="button" style="height: 24px; padding: 0 10px; border: 0; border-radius: 6px; background: {{th.btn}}; color: {{th.text}}; font-size: 12px; font-weight: 500">{{n.action}}</button>
<button type="button" style="height: 24px; padding: 0 10px; border: 0; border-radius: 6px; background: transparent; color: {{th.sec}}; font-size: 12px">Later</button>
</div>
</div>
</div>
</sc-for>
</div>
</div>
</sc-for>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":760,"height":580}}'>
class Component extends DCLogic {
  renderVals() {
    const notes = [
      { title: 'Headroom is low', time: 'now', body: '14 GB free. 2.3 GB of caches can be cleaned without losing anything.', action: 'Review' },
      { title: 'A folder grew fast', time: '9:02', body: 'Chrome temporary copies grew 9.1 GB since yesterday.', action: 'Show' },
      { title: 'Running out in about 6 days', time: 'Mon', body: 'At this rate the disk is full in about 6 days. 4 GB can be cleaned without losing anything.', action: 'Review' }
    ];
    return {
      themes: [
        { name: 'Light', wall: '#9db3cd', b1: '#5b8def', b2: '#f2b45a', card: 'rgba(250,250,252,0.5)', text: '#111114', sec: '#3d3d45', edge: 'rgba(255,255,255,0.85)', rim: 'rgba(255,255,255,0.5)', hair: 'rgba(0,0,0,0.1)', btn: 'rgba(255,255,255,0.6)', notes: notes },
        { name: 'Dark', wall: '#141c2b', b1: '#2d5aa8', b2: '#8a3f6a', card: 'rgba(32,32,38,0.5)', text: '#f5f5f7', sec: '#c4c4cb', edge: 'rgba(255,255,255,0.22)', rim: 'rgba(255,255,255,0.14)', hair: 'rgba(0,0,0,0.4)', btn: 'rgba(255,255,255,0.14)', notes: notes }
      ]
    };
  }
}
</script>
</body>
</html>
